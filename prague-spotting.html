<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Prague Spotting – Letiště Praha</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --tx: #2b2b31;
      --tx2: #8d8d95;
      --late: #c2660a
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: calc(12px + env(safe-area-inset-top)) 16px 120px
    }

    .glass {
      background: rgba(255, 255, 255, .55);
      -webkit-backdrop-filter: blur(14px) saturate(1.5);
      backdrop-filter: blur(14px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, .75);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9), 0 6px 20px rgba(20, 30, 60, .06)
    }

    header {
      position: relative;
      height: 130px;
      border-radius: 30px;
      overflow: hidden
    }

    header svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    header h1 {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      margin: 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.02em;
      color: #4a4a52
    }

    .status {
      margin: 10px 4px 4px;
      font-size: 12px;
      color: var(--tx2);
      text-align: center
    }

    .status.warn {
      color: var(--late)
    }

    .flight {
      margin-top: 10px
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 2px
    }

    .meta.arr {
      justify-content: flex-end
    }

    .pill {
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 99px;
      background: rgba(150, 150, 160, .2);
      color: #5d5d66;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px)
    }

    .ico {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(150, 150, 160, .2);
      color: #5d5d66
    }

    .ico svg {
      width: 15px;
      height: 15px;
      fill: currentColor
    }

    .arr .ico svg {
      transform: rotate(135deg)
    }

    .dep .ico svg {
      transform: rotate(45deg)
    }

    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 22px
    }

    .logo {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 800
    }

    .card b {
      display: block;
      font-weight: 700
    }

    .card small {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--tx2)
    }

    .ac {
      flex: 1 1 0;
      min-width: 0
    }

    .ac b {
      font-size: 15px
    }

    .dest {
      flex: 1 1 0;
      text-align: center;
      min-width: 0
    }

    .dest b {
      font-size: 17px
    }

    .dest small,
    .ac small {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .times {
      text-align: right;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      display: grid;
      gap: 4px
    }

    .times .s {
      color: var(--tx2)
    }

    .times .late {
      color: var(--late)
    }

    .cx {
      text-decoration: line-through
    }

    .empty {
      text-align: center;
      color: var(--tx2);
      padding: 40px 0
    }

    .dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0 16px calc(16px + env(safe-area-inset-bottom));
      pointer-events: none
    }

    .dock>div {
      max-width: 560px;
      margin: 0 auto;
      position: relative
    }

    .bar {
      pointer-events: auto;
      display: inline-flex;
      gap: 8px;
      padding: 6px;
      border-radius: 99px
    }

    .bar button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: none;
      color: var(--tx);
      cursor: pointer;
      display: grid;
      place-items: center
    }

    .bar button:focus-visible {
      outline: 2px solid #5b86d6
    }

    .bar svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .spin svg {
      animation: r .8s linear infinite
    }

    @keyframes r {
      to {
        transform: rotate(360deg)
      }
    }

    .menu {
      pointer-events: auto;
      position: absolute;
      left: 0;
      bottom: 70px;
      min-width: 220px;
      padding: 10px 14px;
      border-radius: 22px
    }

    .menu h3 {
      margin: 8px 0 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--tx2)
    }

    .menu label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      font-size: 15px;
      cursor: pointer
    }

    .menu input {
      width: 18px;
      height: 18px;
      accent-color: #5b86d6
    }

    @media(prefers-reduced-motion:reduce) {
      .spin svg {
        animation: none
      }
    }
  </style>
</head>

  <div class="dock">

  <script>
    const AIRPORT = 'prg', TZ = 'Europe/Prague', REFRESH_MS = 60000;
    // Prohlížeč nemůže číst Flightradar24 napřímo (CORS). Pokud veřejné proxy selžou,
    // nasaď vlastní proxy (např. Cloudflare Worker) a vlož její adresu sem:
    const PROXY_URL = ''; // např. 'https://muj-worker.workers.dev/?url='

    const fr24 = (mode, ts) => `https://api.flightradar24.com/common/v1/airport.json?code=${AIRPORT}&plugin[]=schedule&plugin-setting[schedule][mode]=${mode}&plugin-setting[schedule][timestamp]=${ts}&page=1&limit=100`;
    const ROUTES = [
      ...(PROXY_URL ? [u => PROXY_URL + encodeURIComponent(u)] : []),
      u => u,
      u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
      u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
    ];

    const FAMILIES = ['Boeing', 'Airbus', 'Embraer', 'ATR', 'Ostatní'];
    const famOf = t => /^AT/.test(t) ? 'ATR' : /^(B\d)/.test(t) ? 'Boeing' : /^(A\d|BCS)/.test(t) ? 'Airbus' : /^E\d/.test(t) ? 'Embraer' : 'Ostatní';
    const filters = { arr: true, dep: true, fam: Object.fromEntries(FAMILIES.map(f => [f, true])) };
    let flights = [], live = false, updated = 0;

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hm = ts => new Intl.DateTimeFormat('cs-CZ', { hour: '2-digit', minute: '2-digit', timeZone: TZ }).format(new Date(ts * 1000));

    function parse(json, mode) {
      const isArr = mode === 'arrivals', k = isArr ? 'arrival' : 'departure';
      const rows = json.result.response.airport.pluginData.schedule[mode].data || [];
      return rows.map(({ flight: f }) => {
        const o = (isArr ? f.airport?.origin : f.airport?.destination) || {};
        return {
          isArr, al: f.airline?.code?.iata || f.airline?.code?.icao || '?',
          type: f.aircraft?.model?.code || '—', reg: f.aircraft?.registration || '',
          iata: o.code?.iata || '—',
          city: o.position?.region?.city || (o.name || '').replace(/ (International )?Airport/, ''),
          sched: f.time?.scheduled?.[k], est: f.time?.estimated?.[k], real: f.time?.real?.[k],
          cancelled: /cancel|zrušen/i.test(f.status?.text || '')
        };
      }).filter(f => f.sched);
    }

    async function grab(mode) {
      const ts = Math.floor(Date.now() / 1000);
      for (const route of ROUTES) {
        try {
          const c = new AbortController(), t = setTimeout(() => c.abort(), 9000);
          const res = await fetch(route(fr24(mode, ts)), { signal: c.signal });
          clearTimeout(t);
          if (!res.ok) continue;
          return parse(await res.json(), mode);
        } catch (e) { /* zkus další cestu */ }
      }
      throw new Error('Flightradar24 nedostupný');
    }

    function demo() {
      const n = Date.now() / 1000, m = 60;
      const d = [['EK', 'B77W', 'A6-EQP', 'DXB', 'Dubai', 12, 10, 1], ['QR', 'A35K', 'A7-ANB', 'DOH', 'Doha', 45, 0, 0],
      ['LH', 'A20N', 'D-AINA', 'FRA', 'Frankfurt', 90, 20, 1], ['QS', 'B38M', 'OK-SWA', 'HRG', 'Hurghada', 185, 0, 0],
      ['OK', 'AT76', 'OK-NFV', 'AMS', 'Amsterdam', 25, 5, 0], ['FR', 'B738', 'EI-DCL', 'STN', 'Londýn', 60, 0, 1],
      ['W6', 'A21N', 'HA-LZA', 'BUD', 'Budapešť', 75, 12, 0], ['KL', 'E190', 'PH-EZK', 'AMS', 'Amsterdam', 120, 0, 1],
      ['TK', 'A333', 'TC-JNR', 'IST', 'Istanbul', 150, 25, 0], ['LO', 'E195', 'SP-LNA', 'WAW', 'Varšava', 200, 0, 1]];
      return d.map(([al, type, reg, iata, city, off, delay, isArr]) => ({
        isArr: !!isArr, al, type, reg, iata, city,
        sched: n + off * m, est: n + (off + delay) * m
      }));
    }

    async function load() {
      $('refresh').classList.add('spin');
      try {
        const [a, d] = await Promise.all([grab('arrivals'), grab('departures')]);
        flights = [...a, ...d]; live = true;
      } catch (e) { flights = demo(); live = false; }
      updated = Date.now();
      $('refresh').classList.remove('spin');
      render();
    }

    const plural = m => m === 1 ? 'minutu' : m < 5 ? 'minuty' : 'minut';
    function rel(f, now) {
      if (f.cancelled) return 'Zrušeno';
      if (f.real) return (f.isArr ? 'Přistálo ' : 'Odletělo ') + hm(f.real);
      const m = Math.round(((f.est ?? f.sched) - now) / 60);
      if (m <= -5) return `Před ${-m} min`;
      if (m <= 0) return f.isArr ? 'Právě přistává' : 'Právě odlétá';
      if (m < 60) return `Za ${m} ${plural(m)}`;
      const h = Math.floor(m / 60), r = m % 60;
      return r ? `Za ${h} h ${r} min` : `Za ${h} h`;
    }

    function badge(al) {
      let h = 0; for (const c of al) h = (h * 31 + c.charCodeAt(0)) % 360;
      return `background:hsl(${h} 60% 92%);color:hsl(${h} 45% 32%)`;
    }

    function render() {
      const now = Date.now() / 1000;
      const list = flights
        .filter(f => (f.isArr ? filters.arr : filters.dep) && filters.fam[famOf(f.type)] && (f.est ?? f.sched) > now - 45 * 60)
        .sort((a, b) => (a.est ?? a.sched) - (b.est ?? b.sched));
      const st = $('status');
      st.className = 'status' + (live ? '' : ' warn');
      st.textContent = live
        ? `Živá data z Flightradar24 · aktualizováno ${hm(updated / 1000)}`
        : 'Ukázková data – Flightradar24 se nepodařilo načíst (viz PROXY_URL v kódu).';
      $('list').innerHTML = list.length ? list.map(f => {
        const late = f.est && f.est - f.sched > 300;
        const icon = '<svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';
        const pill = `<span class="pill">${rel(f, now)}</span>`, ic = `<span class="ico">${icon}</span>`;
        return `<article class="flight">
      <div class="meta ${f.isArr ? 'arr' : 'dep'}">${f.isArr ? pill + ic : ic + pill}</div>
      <div class="card glass">
        <div class="logo" style="${badge(f.al)}" title="${esc(f.al)}">${esc(f.al)}</div>
        <div class="ac"><b>${esc(f.type)}</b><small>${esc(f.reg || '—')}</small></div>
        <div class="dest"><b>${esc(f.iata)}</b><small>${esc(f.city)}</small></div>
        <div class="times"><span class="s ${f.cancelled ? 'cx' : ''}">${hm(f.sched)}</span><span class="${late ? 'late' : ''}">${f.est || f.real ? hm(f.est || f.real) : '–'}</span></div>
      </div></article>`;
      }).join('') : '<div class="empty">Žádné lety neodpovídají filtru.</div>';
    }

    function buildMenu() {
      const row = (key, label, on) => `<label><input type="checkbox" data-k="${key}" ${on ? 'checked' : ''}>${label}</label>`;
      $('menu').innerHTML = '<h3>Směr</h3>' + row('arr', 'Přílety', filters.arr) + row('dep', 'Odlety', filters.dep)
        + '<h3>Letadla</h3>' + FAMILIES.map(f => row('fam:' + f, f, filters.fam[f])).join('');
    }
    $('menu').addEventListener('change', e => {
      const k = e.target.dataset.k;
      k.startsWith('fam:') ? filters.fam[k.slice(4)] = e.target.checked : filters[k] = e.target.checked;
      render();
    });
    $('filter').addEventListener('click', () => {
      const m = $('menu'); m.hidden = !m.hidden;
      $('filter').setAttribute('aria-expanded', String(!m.hidden));
    });
    document.addEventListener('click', e => { if (!e.target.closest('.dock')) { $('menu').hidden = true; $('filter').setAttribute('aria-expanded', 'false'); } });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') $('menu').hidden = true; });
    $('refresh').addEventListener('click', load);

    buildMenu();
    load();
    setInterval(load, REFRESH_MS);
    setInterval(render, 30000);
  </script>
</body>

</html>
